name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Validate scripts
        run: zsh -n scripts/*.sh
      - name: Run tests
        run: swift test
      - name: Build release
        run: ./scripts/build-universal.sh
